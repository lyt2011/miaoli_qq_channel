# QQ 通道开关 关了就接收不到 QQ 信息了
enable: true

account:                  # 账号信息 四项全必填
  bot_id: "机器人QQ号"            # 机器人QQ号
  admin_id: "管理员QQ号"          # 管理员QQ号
  bot_nickname: "喵璃"             # 机器人昵称
  admin_nickname: "主人"    # 管理员名称

channel:
  buf_size: 2             # 就绪区上限（条） 满了调度器等下一 tick 再交

message:
  buf_size: 30            # 每个会话的未读上限（条） 超了只丢最旧的「没叫我」的消息

send_budget:              # 一轮跑图里的发送预算：防止模型一直调发送工具刷屏
  enable: true            # 关掉就不限制 完全靠模型自觉
  max_messages: 3         # 一轮最多用 send_message_to_qq 发几条文字（0 表示不限）
  max_memes: 2            # 一轮最多发表情包（0 表示不限）
  max_pokes: 1            # 一轮最多戳几次（0 表示不限）

media:                    # 入站媒体缓存：图片一进来就下载到本地 模型直接 read_image 看
  enable: true            # 关掉就退回「给模型图片 URL」 链接几分钟后会过期
  path: null              # 缓存目录 留空用插件 data/media
  max_megabytes: 20       # 单个文件大小上限（MB）
  max_files: 500          # 缓存目录最多保留多少个文件
  timeout_seconds: 10.0   # 单个下载超时（秒）

social:                   # 会话社交状态机 diving / active（普通消息的默认策略）
  enabled: true           # 关掉退回旧行为：被叫到就立刻提交，不限流不攒批
  tick_seconds: 1.0       # 调度器 tick 间隔（秒）
  quiet: 8.0              # 静默窗口：连续这么久没有新消息才提交被叫窗口
  chance: 0.05            # 潜水时普通消息的随机唤醒概率
  chance_cooldown_seconds: 120.0  # 随机唤醒成功后的冷却（秒）
  max_submit_per_minute: 1        # 每个会话每分钟最多提交几次
  max_submit_per_hour: 12         # 每个会话每小时最多提交几次
  idle_minutes: 6                 # 聊天状态下多久没人说话就回潜水（分钟）
  in_flight_timeout_seconds: 240  # 在途窗口超时（秒）超了放行下一轮
  wake:                   # 唤醒条件 @ 与昵称默认开 其余按需
    at: true              # 群里 @ 我
    name: true            # 正文里叫到昵称
    keyword: false        # 命中关键词族
    keyword_list: []      # 关键词族列表
    question: false       # 像在问 AI 的句子
    quote: false          # 有人引用消息（近似判定）

follow:                   # 跟随：被叫之后的一段时间里，该会话的消息跳过随机策略、安静合并后再提交
  enable: true            # 开跟随；关掉后只有被叫或随机概率才开窗
  duration_minutes: 10    # 一次跟随最长持续（分钟），每次成功提交后重新计时
  merge_quiet_seconds: 10.0       # 合并窗口：安静这么久才把这一串消息合并提交（连发不再各开一窗）
  min_interval_seconds: 3.0       # 跟随中两次提交的最小间隔（秒）
  max_submit_per_minute: 2        # 跟随中每分钟最多提交几次
  max_submit_per_hour: 30         # 跟随中每小时最多提交几次

snapshot:                 # 交给模型的未读快照
  unread_limit: 30        # 一次最多带多少条未读
  max_chars: 6000         # 快照正文总字数上限 超了从最旧的开始省
  old_message_minutes: 30 # 最新一条超过这么久就提醒「这是旧账」

delivery:                 # 发送节流
  burst_enable: true      # 分条之间加停顿
  burst_interval_min: 1.0 # 分条停顿下限（秒）
  burst_interval_max: 3.0 # 分条停顿上限（秒）
  long_gap_probability: 0.1  # 使用长停顿的概率
  long_gap_min: 2.5       # 长停顿下限（秒）
  long_gap_max: 5.0       # 长停顿上限（秒）
  max_send_per_minute: 8  # 每个会话每分钟最多发几条
  max_send_per_hour: 60   # 每个会话每小时最多发几条

submit:                   # 入口白名单与回复上限
  group_whitelist: []     # 群白名单；空列表拒绝所有群
  at_only_in_group: false # true 时仅 @ 触发 昵称/关键词/随机都不唤醒
  nickname_variants: []   # 额外唤醒昵称 account.bot_nickname 始终生效
  max_reply_chars: 500    # 自动群回复字符上限；超限整条不发送

split:                    # 输出分割 按空行切成几条就发几条
  enable: true

typing:                   # 打字延迟 base_speed=0 等价于关
  enable: true
  base_speed: 0.06        # 每个字的打字时间（秒）
  speed_offset: 0.02      # 每字速度偏移（须 < base_speed，否则每字时间可为负）

voice:                    # 语音发送 按概率把整条回复的每一条都换成 MiMo 语音
  enable: false           # 开了才会发语音
  probability: 0.3        # 每条回复改成语音的概率 0 到 1 命中后按空行逐条各合成一段
  mimo_url: "https://api.xiaomimimo.com/v1/chat/completions"   # MiMo 语音合成接口地址
  mimo_key: ""            # MiMo 的 API Key 填在这里 不要提交到仓库
  model: "mimo-v2.5-tts"  # 语音合成模型
  voice: "冰糖"           # 预置音色 ID 可选 冰糖 茉莉 苏打 白桦 Mia Chloe Milo Dean
  style: ""               # 语气指令 放在 user 角色 留空只传朗读文本
  min_chars: 10           # 不足这么多字的一条不转语音 直接发文字
  max_chars: 30           # 超过这么多字的一条不转语音 直接发文字

corpus:                   # 可选 语料录制 默认关
  enable: false           # 开了才写文件 每条消息落一行 JSONL
  path: null              # 留空写 data/corpus.jsonl
  encoding: "utf-8"       # 写文件用的编码
  flush: true             # 每条写完立刻刷盘 不刷最多丢最后一条
